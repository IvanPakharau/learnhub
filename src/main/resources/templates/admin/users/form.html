<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout :: content">

<div class="card">
    <div class="card-header">
        <h3 class="card-title" th:text="${user?.id != null ? 'Edit User' : 'Create User'}"></h3>
    </div>
    <form th:action="@{${user?.id != null ? '/admin/users/edit/' + user.id : '/admin/users/create'}}"
          method="post">
        <div class="card-body">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-control"
                       th:value="${user?.username}">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control"
                       th:value="${user?.email}">
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="fullName" class="form-control"
                       th:value="${user?.fullName}">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control">
                <small th:if="${user?.id != null}">(leave blank to keep current)</small>
            </div>
            <div class="form-group">
                <label>Role</label>
                <select name="role" class="form-control">
                    <option th:each="r : ${roles}"
                            th:value="${r}"
                            th:text="${r}"
                            th:selected="${user?.role == r}"></option>
                </select>
            </div>
        </div>
        <div class="card-footer">
            <button type="submit" class="btn btn-success">Save</button>
            <a th:href="@{/admin/users}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
